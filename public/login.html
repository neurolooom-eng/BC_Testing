<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bestcast — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <div class="stage">
    <div class="brand">
      <div class="mark">
        <img src="logo.svg" alt="Bestcast logo" data-brand-mark>
      </div>
      <h1>Bestcast</h1>
      <p>Sign in to your account</p>
    </div>

    <form class="card">
      <p class="error-msg" id="form-error"></p>

      <div class="field">
        <label for="userid">User ID</label>
        <div class="input-wrap">
          <input type="text" id="userid" name="userid" placeholder="Enter your user ID" required autocomplete="username">
        </div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
        </div>
      </div>

      <div class="row">
        <div class="remember-row">
          <input type="checkbox" id="remember-me">
          <label for="remember-me">Remember me</label>
        </div>
        <button type="button" class="forgot">Forgot password?</button>
      </div>

      <button type="submit" class="btn-primary" id="submit-btn">Log In</button>

      <div class="divider">or</div>

      <p class="signup">New here? <a href="signup.html">Create an account</a></p>
    </form>

    <p class="build-footer"></p>
  </div>

  <script src="js/build-info.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/brand.js"></script>
  <script src="js/error-handler.js"></script>
  <script src="js/temp-local-auth.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
