<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bestcast — Set New Password</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --navy-deep: #07061f; --teal: #2fa787; --orange: #e8823a; --cream: #f6f4ee; --mute: rgba(246,244,238,0.55); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--navy-deep);
    color: var(--cream);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: rgba(246,244,238,0.04);
    border: 1px solid rgba(246,244,238,0.12);
    border-radius: 18px;
    padding: 32px;
  }
  h1 { font-family: 'Fraunces', serif; font-size: 22px; margin-bottom: 20px; }
  label { display: block; font-size: 11.5px; text-transform: uppercase; letter-spacing: 1px; color: var(--mute); margin-bottom: 8px; }
  input {
    width: 100%;
    padding: 12px 14px;
    margin-bottom: 18px;
    background: rgba(246,244,238,0.05);
    border: 1px solid rgba(246,244,238,0.18);
    border-radius: 10px;
    color: var(--cream);
    font-size: 14px;
    font-family: inherit;
  }
  button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, var(--teal), var(--orange));
    color: var(--navy-deep);
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }
  .msg { font-size: 12.5px; margin-bottom: 16px; display: none; }
  .msg.error { color: #f5b5b5; }
  .msg.success { color: #bdeee0; }
</style>
</head>
<body>
  <div class="card">
    <h1>Set a new password</h1>
    <p class="msg" id="msg"></p>
    <label for="password">New password</label>
    <input type="password" id="password" placeholder="At least 8 characters" autocomplete="new-password">
    <button id="submit-btn">Update password</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script>
    // Supabase's invite/reset link puts a recovery token in the URL, which
    // supabase-js exchanges for a session automatically on page load.
    function showMsg(text, kind) {
      const el = document.getElementById("msg");
      el.textContent = text;
      el.className = `msg ${kind}`;
      el.style.display = "block";
    }

    document.getElementById("submit-btn").addEventListener("click", async () => {
      const password = document.getElementById("password").value;
      if (password.length < 8) {
        showMsg("Password must be at least 8 characters.", "error");
        return;
      }
      const { error } = await supabaseClient.auth.updateUser({ password });
      if (error) {
        showMsg(error.message, "error");
        return;
      }
      showMsg("Password updated. Redirecting to login…", "success");
      setTimeout(() => (window.location.href = "login.html"), 1500);
    });
  </script>
</body>
</html>
