<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bestcast — Set New Password</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div class="card" style="width:100%;max-width:380px;">
    <h1 style="font-family:'Fraunces',serif;font-size:22px;margin-bottom:20px;">Set a new password</h1>
    <p class="error-msg" id="msg-error"></p>
    <p class="success-msg" id="msg-success"></p>
    <div class="field">
      <label for="password">New password</label>
      <div class="input-wrap">
        <input type="password" id="password" placeholder="At least 8 characters" autocomplete="new-password">
      </div>
    </div>
    <button class="btn-primary" id="submit-btn">Update password</button>
    <p class="build-footer"></p>
  </div>

  <script src="js/build-info.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/error-handler.js"></script>
  <script src="js/offline.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script>
    function showMsg(text, kind) {
      var errEl = document.getElementById("msg-error");
      var okEl = document.getElementById("msg-success");
      errEl.style.display = "none";
      okEl.style.display = "none";
      var target = kind === "error" ? errEl : okEl;
      target.textContent = text;
      target.style.display = "block";
    }

    document.getElementById("submit-btn").addEventListener("click", async () => {
      const password = document.getElementById("password").value;
      if (password.length < 8) {
        showMsg("Password must be at least 8 characters.", "error");
        return;
      }
      const { error } = await supabaseClient.auth.updateUser({ password });
      if (error) {
        showMsg(error.message, "error");
        return;
      }
      showMsg("Password updated. Redirecting to login…", "success");
      setTimeout(() => (window.location.href = "login.html"), 1500);
    });
  </script>
</body>
</html>
