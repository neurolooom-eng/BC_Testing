<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bestcast — Create Account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0d0b5c;
    --navy-deep: #07061f;
    --teal: #2fa787;
    --orange: #e8823a;
    --cream: #f6f4ee;
    --mute: rgba(246,244,238,0.55);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    font-family: 'Inter', sans-serif;
    background:
      radial-gradient(circle at 20% 15%, rgba(47,167,135,0.16), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(232,130,58,0.14), transparent 50%),
      var(--navy-deep);
    color: var(--cream);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    overflow-x: hidden;
  }

  .stage { width: 100%; max-width: 400px; position: relative; }

  .brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 34px;
  }

  .mark {
    position: relative;
    width: 92px;
    height: 92px;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .mark::before {
    content: "";
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, var(--teal), var(--orange), var(--teal));
    opacity: 0.35;
    filter: blur(6px);
    animation: spin 9s linear infinite;
  }

  .mark img {
    position: relative;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: var(--cream);
    border-radius: 50%;
    padding: 10px;
    z-index: 1;
  }

  /* Stands in for the logo when the asset is unavailable — see js/brand.js. */
  .mark .logo-fallback {
    position: relative;
    width: 100%;
    height: 100%;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--cream);
    color: var(--navy);
    border-radius: 50%;
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 46px;
    line-height: 1;
    user-select: none;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .brand h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 26px;
    letter-spacing: 0.5px;
  }

  .brand p {
    margin-top: 4px;
    font-size: 12.5px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--mute);
  }

  .card {
    position: relative;
    background: rgba(246,244,238,0.04);
    border: 1px solid rgba(246,244,238,0.12);
    backdrop-filter: blur(14px);
    border-radius: 18px;
    padding: 36px 32px 32px;
    box-shadow: 0 30px 60px -25px rgba(0,0,0,0.6);
  }

  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 20px; right: 20px;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--teal), var(--orange), transparent);
    border-radius: 2px;
  }

  .field { margin-bottom: 20px; }

  .field label {
    display: block;
    font-size: 11.5px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--mute);
    margin-bottom: 8px;
  }

  .input-wrap input {
    width: 100%;
    padding: 12px 14px;
    background: rgba(246,244,238,0.05);
    border: 1px solid rgba(246,244,238,0.18);
    border-radius: 10px;
    color: var(--cream);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s ease, background 0.2s ease;
  }

  .input-wrap input::placeholder { color: rgba(246,244,238,0.32); }

  .input-wrap input:focus {
    border-color: var(--teal);
    background: rgba(47,167,135,0.08);
  }

  .error-msg {
    display: none;
    background: rgba(232, 58, 58, 0.12);
    border: 1px solid rgba(232, 58, 58, 0.4);
    color: #f5b5b5;
    font-size: 12.5px;
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 18px;
  }

  .success-msg {
    display: none;
    background: rgba(47, 167, 135, 0.14);
    border: 1px solid rgba(47, 167, 135, 0.4);
    color: #bdeee0;
    font-size: 12.5px;
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 18px;
  }

  .btn-primary {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, var(--teal), var(--orange));
    color: var(--navy-deep);
    font-family: inherit;
    font-weight: 600;
    font-size: 14.5px;
    cursor: pointer;
    margin-top: 4px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 10px 24px -10px rgba(232,130,58,0.5);
  }

  .btn-primary:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  .signup {
    text-align: center;
    font-size: 13px;
    color: var(--mute);
    margin-top: 22px;
  }

  .signup a {
    color: var(--cream);
    font-weight: 600;
    text-decoration: none;
    border-bottom: 1px solid var(--teal);
    padding-bottom: 1px;
  }

  .signup a:hover { color: var(--teal); }

  .build-footer {
    margin-top: 22px;
    text-align: center;
    font-size: 10.5px;
    letter-spacing: 0.3px;
    color: var(--mute);
  }

  @media (max-width: 420px) {
    .card { padding: 30px 22px 26px; }
  }
</style>
</head>
<body>

  <div class="stage">
    <div class="brand">
      <div class="mark">
        <img src="logo.svg" alt="Bestcast logo" data-brand-mark>
      </div>
      <h1>Bestcast</h1>
      <p>Request an account</p>
    </div>

    <form class="card">
      <p class="error-msg" id="form-error"></p>
      <p class="success-msg" id="form-success"></p>

      <div class="field">
        <label for="fullname">Full Name</label>
        <div class="input-wrap">
          <input type="text" id="fullname" name="fullname" placeholder="Jane Smith" required autocomplete="name">
        </div>
      </div>

      <div class="field">
        <label for="userid">User ID (email)</label>
        <div class="input-wrap">
          <input type="email" id="userid" name="userid" placeholder="you@bestcast.com" required autocomplete="username">
        </div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input type="password" id="password" name="password" placeholder="At least 8 characters" required autocomplete="new-password">
        </div>
      </div>

      <div class="field">
        <label for="confirm-password">Confirm Password</label>
        <div class="input-wrap">
          <input type="password" id="confirm-password" name="confirm-password" placeholder="Re-enter password" required autocomplete="new-password">
        </div>
      </div>

      <button type="submit" class="btn-primary" id="submit-btn">Create Account</button>

      <p class="signup">Already have an account? <a href="login.html">Log in</a></p>
    </form>

    <p class="build-footer"></p>
  </div>

  <script src="js/build-info.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/brand.js"></script>
  <script src="js/signup.js"></script>
</body>
</html>
