<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bestcast — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --navy-deep: #07061f; --teal: #2fa787; --orange: #e8823a; --cream: #f6f4ee; --mute: rgba(246,244,238,0.55); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--navy-deep);
    color: var(--cream);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 40px 20px;
  }
  h1 { font-family: 'Fraunces', serif; font-size: 24px; }
  p { color: var(--mute); font-size: 14px; text-align: center; max-width: 420px; }
  button {
    padding: 10px 20px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, var(--teal), var(--orange));
    color: var(--navy-deep);
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }
  .dev-link {
    font-size: 12.5px;
    color: var(--teal);
    text-decoration: none;
    border-bottom: 1px solid var(--teal);
    padding-bottom: 1px;
    display: none;
  }
  .build-footer {
    margin-top: 10px;
    text-align: center;
    font-size: 10.5px;
    letter-spacing: 0.3px;
    color: var(--mute);
  }
</style>
</head>
<body>
  <h1>You're signed in</h1>
  <p id="welcome">Loading your profile…</p>
  <a href="dev.html" class="dev-link" id="dev-link">Dev Page (version history)</a>
  <button id="logout">Log out</button>
  <p class="build-footer"></p>

  <script src="js/build-info.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/temp-local-auth.js"></script>
  <script>
    // TEMPORARY: gated by the hardcoded local session, not Supabase.
    // See BACKLOG.md for restoring real Supabase-backed auth.
    const session = tempGetSession();
    if (!session) {
      window.location.href = "login.html";
    } else {
      document.getElementById("welcome").textContent = `Welcome, ${session.fullName}.`;
      if (DEV_PAGE_USERS.includes(session.userid)) {
        document.getElementById("dev-link").style.display = "inline";
      }
    }

    document.getElementById("logout").addEventListener("click", () => {
      tempClearSession();
      window.location.href = "login.html";
    });
  </script>
</body>
</html>
