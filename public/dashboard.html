<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bestcast — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0d0b5c;
    --navy-deep: #07061f;
    --teal: #2fa787;
    --orange: #e8823a;
    --cream: #f6f4ee;
    --mute: rgba(246,244,238,0.55);
  }

  :root {
    --content-bg: var(--navy-deep);
    --content-fg: var(--cream);
    --content-mute: var(--mute);
    --card-bg: rgba(246,244,238,0.04);
    --card-border: rgba(246,244,238,0.12);
  }

  body.light-theme {
    --content-bg: #ffffff;
    --content-fg: #000000;
    --content-mute: #555555;
    --card-bg: #f5f5f5;
    --card-border: #dddddd;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--content-bg);
    color: var(--content-fg);
    min-height: 100vh;
    transition: background 150ms ease, color 150ms ease;
  }

  /* ---------- Top bar ---------- */

  .topbar {
    height: 86px;
    width: 100%;
    display: flex;
    align-items: center;
    padding: 0 28px;
    gap: 12px;
    background:
      radial-gradient(circle at 32% 0%, rgba(47,167,135,0.28), transparent 32%),
      radial-gradient(circle at 70% 100%, rgba(232,130,58,0.18), transparent 35%),
      linear-gradient(100deg, #04030c 0%, var(--navy-deep) 45%, var(--navy) 75%, #04030c 100%);
    border-bottom: 1px solid rgba(246,244,238,0.08);
    color: var(--cream);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 220px;
  }

  .brand-logo {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--cream);
    object-fit: contain;
    padding: 6px;
  }

  .brand-name {
    font-family: 'Fraunces', serif;
    color: var(--cream);
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.2px;
  }

  .main-nav {
    display: flex;
    align-items: center;
    gap: 8px;
    overflow-x: auto;
  }

  .nav-item {
    position: relative;
    height: 56px;
    padding: 0 22px;
    display: flex;
    align-items: center;
    gap: 10px;
    color: rgba(246,244,238,0.75);
    text-decoration: none;
    font-size: 14.5px;
    font-weight: 500;
    border-radius: 14px;
    white-space: nowrap;
    transition: background 180ms ease, color 180ms ease;
  }

  .nav-item svg {
    width: 20px;
    height: 20px;
    stroke: currentColor;
    stroke-width: 1.8;
    fill: none;
    flex-shrink: 0;
  }

  .nav-item:hover {
    background: rgba(246,244,238,0.06);
    color: var(--cream);
  }

  .nav-item.active {
    color: var(--cream);
    background: linear-gradient(135deg, rgba(47,167,135,0.55), rgba(232,130,58,0.30));
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.08),
      0 4px 18px rgba(0,0,0,0.25);
  }

  .nav-item.active::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 50%;
    width: 32px;
    height: 3px;
    transform: translateX(-50%);
    background: var(--teal);
    border-radius: 3px 3px 0 0;
  }

  .header-actions {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 20px;
    position: relative;
  }

  .user {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    padding: 6px 8px;
    border-radius: 10px;
    transition: background 150ms ease;
  }

  .user:hover { background: rgba(246,244,238,0.06); }

  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--teal), var(--orange));
    color: var(--navy-deep);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 14px;
    flex-shrink: 0;
  }

  .user-name {
    color: var(--cream);
    font-size: 14px;
    font-weight: 500;
  }

  .user-chevron {
    width: 16px;
    height: 16px;
    stroke: rgba(246,244,238,0.7);
    stroke-width: 2;
    fill: none;
    transition: transform 150ms ease;
  }

  .user.open .user-chevron { transform: rotate(180deg); }

  .user-dropdown {
    display: none;
    position: absolute;
    top: 52px;
    right: 0;
    min-width: 180px;
    background: #0d0c2a;
    border: 1px solid rgba(246,244,238,0.14);
    border-radius: 12px;
    padding: 6px;
    box-shadow: 0 20px 40px -15px rgba(0,0,0,0.6);
  }

  .user-dropdown.open { display: block; }

  .user-dropdown a,
  .user-dropdown button {
    display: block;
    width: 100%;
    text-align: left;
    padding: 10px 12px;
    border-radius: 8px;
    border: none;
    background: none;
    color: var(--cream);
    font-family: inherit;
    font-size: 13.5px;
    text-decoration: none;
    cursor: pointer;
  }

  .user-dropdown a:hover,
  .user-dropdown button:hover {
    background: rgba(246,244,238,0.08);
  }

  .nav-item-wrap { position: relative; }

  button.nav-item {
    background: none;
    border: none;
    font: inherit;
    cursor: pointer;
  }

  .nav-chevron {
    width: 14px;
    height: 14px;
    stroke: currentColor;
    stroke-width: 2;
    fill: none;
    transition: transform 150ms ease;
  }

  .nav-item-wrap.open .nav-chevron { transform: rotate(180deg); }

  .nav-dropdown {
    display: none;
    position: absolute;
    top: 62px;
    left: 0;
    min-width: 160px;
    background: #0d0c2a;
    border: 1px solid rgba(246,244,238,0.14);
    border-radius: 12px;
    padding: 6px;
    box-shadow: 0 20px 40px -15px rgba(0,0,0,0.6);
    z-index: 20;
  }

  .nav-dropdown.open { display: block; }

  .nav-dropdown a {
    display: block;
    padding: 10px 12px;
    border-radius: 8px;
    color: var(--cream);
    font-size: 13.5px;
    text-decoration: none;
  }

  .nav-dropdown a:hover {
    background: rgba(246,244,238,0.08);
  }

  @media (max-width: 720px) {
    .topbar { padding: 0 16px; gap: 8px; }
    .brand-name { display: none; }
    .nav-item { padding: 0 14px; font-size: 13.5px; }
    .user-name { display: none; }
  }

  /* ---------- Page content ---------- */

  .content {
    max-width: 960px;
    margin: 0 auto;
    padding: 48px 24px 24px;
  }

  .content h1 {
    font-family: 'Fraunces', serif;
    font-size: 26px;
    margin-bottom: 8px;
  }

  .content p.subtitle {
    color: var(--content-mute);
    font-size: 14px;
    margin-bottom: 32px;
  }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 20px;
    transition: background 150ms ease, border-color 150ms ease;
  }

  .card h2 {
    font-size: 14px;
    color: var(--content-mute);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 8px;
  }

  .card p {
    font-size: 13px;
    color: var(--content-mute);
  }

  .build-footer {
    text-align: center;
    font-size: 10.5px;
    letter-spacing: 0.3px;
    color: var(--content-mute);
    padding: 24px;
  }

  /* ---------- Theme toggle (top bar colors never change) ---------- */

  .theme-toggle {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid rgba(246,244,238,0.18);
    background: rgba(246,244,238,0.06);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 150ms ease;
  }

  .theme-toggle:hover { background: rgba(246,244,238,0.12); }

  .theme-toggle svg {
    width: 19px;
    height: 19px;
    stroke: var(--cream);
    stroke-width: 1.8;
    fill: none;
  }
</style>
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <img class="brand-logo" src="images/logo.png" alt="Bestcast logo">
      <span class="brand-name">Bestcast</span>
    </div>

    <nav class="main-nav">
      <a class="nav-item active" href="dashboard.html">
        <svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
        Overview
      </a>
      <a class="nav-item" href="#" title="Coming soon">
        <svg viewBox="0 0 24 24"><path d="M9 3v18"/><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M14 9h4M14 13h4M14 17h4"/></svg>
        Production Records
      </a>
      <a class="nav-item" href="#" title="Coming soon">
        <svg viewBox="0 0 24 24"><path d="M4 20V10"/><path d="M12 20V4"/><path d="M20 20v-7"/></svg>
        Reports
      </a>
      <div class="nav-item-wrap" id="team-menu-wrap">
        <button class="nav-item" id="team-menu-trigger" type="button">
          <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 8.2a3.2 3.2 0 1 1 3.2 3.2"/><path d="M15.5 14.2c2.7.3 4.9 2.4 5.4 5.6"/></svg>
          Team
          <svg class="nav-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="nav-dropdown" id="team-dropdown">
          <a href="#" title="Coming soon">Roster</a>
        </div>
      </div>
    </nav>

    <div class="header-actions">
      <button class="theme-toggle" id="theme-toggle" type="button" title="Toggle light/dark theme" aria-label="Toggle light and dark theme">
        <svg id="icon-moon" viewBox="0 0 24 24"><path d="M21 12.5A8.5 8.5 0 1 1 11.5 3a7 7 0 0 0 9.5 9.5Z"/></svg>
        <svg id="icon-sun" viewBox="0 0 24 24" style="display:none;"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v3M12 18.5v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2.5 12h3M18.5 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>
      </button>
      <div class="user" id="user-menu-trigger">
        <div class="avatar" id="avatar">·</div>
        <span class="user-name" id="user-name">Loading…</span>
        <svg class="user-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      <div class="user-dropdown" id="user-dropdown">
        <a href="dev.html" id="dev-link" style="display:none;">Dev Page</a>
        <button id="logout">Log out</button>
      </div>
    </div>
  </header>

  <main class="content">
    <h1 id="welcome-heading">Welcome back</h1>
    <p class="subtitle" id="welcome">Loading your profile…</p>

    <div class="cards">
      <div class="card">
        <h2>Production Records</h2>
        <p>Coming soon.</p>
      </div>
      <div class="card">
        <h2>Reports</h2>
        <p>Coming soon.</p>
      </div>
      <div class="card">
        <h2>Team</h2>
        <p>Coming soon. Includes Roster.</p>
      </div>
    </div>
  </main>

  <p class="build-footer"></p>

  <script src="js/build-info.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/temp-local-auth.js"></script>
  <script>
    // TEMPORARY: gated by the hardcoded local session, not Supabase.
    // See BACKLOG.md for restoring real Supabase-backed auth.
    const session = tempGetSession();
    if (!session) {
      window.location.href = "login.html";
    } else {
      document.getElementById("welcome").textContent = `Signed in as ${session.fullName}.`;
      document.getElementById("user-name").textContent = session.fullName;
      document.getElementById("avatar").textContent = session.fullName.charAt(0).toUpperCase();
      if (DEV_PAGE_USERS.includes(session.userid)) {
        document.getElementById("dev-link").style.display = "block";
      }
    }

    const userTrigger = document.getElementById("user-menu-trigger");
    const userDropdown = document.getElementById("user-dropdown");
    const teamWrap = document.getElementById("team-menu-wrap");
    const teamDropdown = document.getElementById("team-dropdown");

    function closeAllMenus() {
      userTrigger.classList.remove("open");
      userDropdown.classList.remove("open");
      teamWrap.classList.remove("open");
      teamDropdown.classList.remove("open");
    }

    userTrigger.addEventListener("click", (e) => {
      e.stopPropagation();
      const willOpen = !userDropdown.classList.contains("open");
      closeAllMenus();
      if (willOpen) {
        userTrigger.classList.add("open");
        userDropdown.classList.add("open");
      }
    });

    teamWrap.addEventListener("click", (e) => {
      e.stopPropagation();
      const willOpen = !teamDropdown.classList.contains("open");
      closeAllMenus();
      if (willOpen) {
        teamWrap.classList.add("open");
        teamDropdown.classList.add("open");
      }
    });

    document.addEventListener("click", closeAllMenus);

    document.getElementById("logout").addEventListener("click", () => {
      tempClearSession();
      window.location.href = "login.html";
    });

    // Light/dark theme toggle. Default is dark; the top bar's colors never
    // change, only the page content below it (see body.light-theme rules).
    const THEME_KEY = "bestcast_theme";
    const themeToggle = document.getElementById("theme-toggle");
    const iconMoon = document.getElementById("icon-moon");
    const iconSun = document.getElementById("icon-sun");

    function applyTheme(theme) {
      document.body.classList.toggle("light-theme", theme === "light");
      iconMoon.style.display = theme === "light" ? "none" : "block";
      iconSun.style.display = theme === "light" ? "block" : "none";
    }

    applyTheme(localStorage.getItem(THEME_KEY) || "dark");

    themeToggle.addEventListener("click", () => {
      const next = document.body.classList.contains("light-theme") ? "dark" : "light";
      localStorage.setItem(THEME_KEY, next);
      applyTheme(next);
    });
  </script>
</body>
</html>
