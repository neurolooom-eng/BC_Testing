<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bestcast — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

  <main class="content">
    <h1>Welcome back</h1>
    <p class="subtitle" id="welcome">Loading your profile…</p>

    <div class="cards">
      <a class="card" href="production-records.html">
        <h2>Production Records</h2>
        <p>Process Check Sheet and shop-floor records.</p>
      </a>
      <div class="card">
        <h2>Reports</h2>
        <p>Coming soon.</p>
      </div>
      <div class="card">
        <h2>Team</h2>
        <p>Coming soon. Includes Roster.</p>
      </div>
      <a class="card" href="configuration.html" id="config-card" style="display:none;">
        <h2>Configuration</h2>
        <p>Users, roles and access control.</p>
      </a>
    </div>
  </main>

  <p class="build-footer"></p>

  <script src="js/build-info.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/brand.js"></script>
  <script src="js/temp-local-auth.js"></script>
  <script src="js/rbac.js"></script>
  <script src="js/topbar.js"></script>
  <script>
    // TEMPORARY: gated by the hardcoded local session, not Supabase.
    // See BACKLOG.md for restoring real Supabase-backed auth.
    const session = renderTopbar("overview");
    if (session && rbacRequirePage(session, "page.overview", "login.html")) {
      document.getElementById("welcome").textContent = `Signed in as ${session.fullName}.`;
      if (rbacCanViewPage(session.userid, "page.configuration")) {
        document.getElementById("config-card").style.display = "block";
      }
    }
  </script>
</body>
</html>
