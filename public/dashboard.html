<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bestcast — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --navy-deep: #07061f; --teal: #2fa787; --orange: #e8823a; --cream: #f6f4ee; --mute: rgba(246,244,238,0.55); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--navy-deep);
    color: var(--cream);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 40px 20px;
  }
  h1 { font-family: 'Fraunces', serif; font-size: 24px; }
  p { color: var(--mute); font-size: 14px; text-align: center; max-width: 420px; }
  button {
    padding: 10px 20px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, var(--teal), var(--orange));
    color: var(--navy-deep);
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }
</style>
</head>
<body>
  <h1>You're signed in</h1>
  <p id="welcome">Loading your profile…</p>
  <button id="logout">Log out</button>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script>
    // Placeholder landing page — replace with the real app.
    (async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        window.location.href = "login.html";
        return;
      }
      const { data: profile } = await supabaseClient
        .from("profiles")
        .select("full_name, role, department")
        .eq("id", session.user.id)
        .single();
      document.getElementById("welcome").textContent = profile
        ? `Welcome, ${profile.full_name} (${profile.role || "no role set"} — ${profile.department || "no department"}).`
        : `Welcome, ${session.user.email}.`;
    })();

    document.getElementById("logout").addEventListener("click", async () => {
      await supabaseClient.auth.signOut();
      window.location.href = "login.html";
    });
  </script>
</body>
</html>
