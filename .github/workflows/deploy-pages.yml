name: Deploy public/ to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["public/**", "VERSION", "BACKLOG.md", "[Ll]ogo.svg"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage root logo into the published folder
        # Logo.svg lives at the repo root, but only public/ is published,
        # so copy it in at build time. Matched case-insensitively since
        # the file may be committed as Logo.svg or logo.svg.
        run: |
          SRC=$(find . -maxdepth 1 -iname 'logo.svg' | head -n1)
          if [ -n "$SRC" ]; then
            cp "$SRC" public/logo.svg
            echo "Staged $SRC -> public/logo.svg"
          else
            echo "::warning::No logo.svg at repo root; the brand mark will not render."
          fi
      - name: Stage backlog into the published docs
        # BACKLOG.md is kept at the repo root (referenced by README/SETUP),
        # but the Dev page reads it from docs/, which must be inside public/.
        run: |
          mkdir -p public/docs
          cp BACKLOG.md public/docs/backlog.md
      - name: Generate build info (version, build number, build date)
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          BUILD_NUMBER="${{ github.run_number }}"
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          cat > public/js/build-info.js <<EOF
          window.BUILD_INFO = { version: "${VERSION}", buildNumber: ${BUILD_NUMBER}, buildDate: "${BUILD_DATE}" };
          EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
